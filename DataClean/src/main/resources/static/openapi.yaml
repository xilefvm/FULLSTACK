openapi: 3.1.0
info:
  title: DataClean
  version: 1.0.0
  description: Versioned CSV, JSONL and XLSX validation with asynchronous runs and downloadable issue reports.
servers:
  - url: /
paths:
  /api/schemas:
    get:
      operationId: listSchemaVersions
      summary: List registered schema versions
      parameters:
        - in: query
          name: prefix
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Schema versions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, version]
                  properties:
                    name: {type: string}
                    version: {type: integer}
        '400': {description: Invalid prefix or limit}
  /api/schemas/{name}/versions/{version}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'}
      - name: version
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    put:
      operationId: putSchemaVersion
      summary: Create an immutable schema version
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Schema'}
      responses:
        '200':
          description: Identical version already exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schema'}
        '201':
          description: Version created
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schema'}
        '400': {description: Invalid schema}
        '409': {description: Version exists with a different definition}
    get:
      operationId: getSchemaVersion
      summary: Read a schema version
      responses:
        '200':
          description: Schema definition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schema'}
        '404': {description: Schema version not found}
  /api/runs:
    get:
      operationId: listRecentRuns
      summary: List the most recent runs in descending submission order
      parameters:
        - in: query
          name: state
          schema: {type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED]}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Run'}
        '400': {description: Invalid state or limit}
    post:
      operationId: submitRun
      summary: Store a dataset and queue validation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [schemaName, schemaVersion, file]
              properties:
                schemaName: {type: string}
                schemaVersion: {type: integer, minimum: 1}
                format: {$ref: '#/components/schemas/DatasetFormat'}
                retainRecords:
                  type: boolean
                  default: false
                  description: Keep normalized rows for download for seven days after completion.
                sheet:
                  type: string
                  maxLength: 31
                  description: XLSX sheet name. Omit to read the first sheet.
                file: {type: string, format: binary, description: CSV or JSONL in UTF-8 or Excel XLSX up to 20 MiB}
      responses:
        '202':
          description: Run queued
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '400': {description: Missing or invalid request fields}
        '404': {description: Schema version not found}
        '413': {description: Upload exceeds the multipart size limit}
  /api/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      summary: Read run status and final counts
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {description: Run not found}
  /api/runs/{id}/issues:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: previewRunIssues
      summary: Read the first issues for a completed run
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Issues ordered by row and index
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Issue'}
        '400': {description: Invalid limit}
        '404': {description: Run not found}
        '409': {description: Run has not completed successfully}
  /api/runs/{id}/corrections:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: revalidateWithCorrections
      summary: Apply confirmed cell edits to retained rejected rows and queue a linked validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edits]
              properties:
                edits:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [row, column, value]
                    properties:
                      row: {type: integer, format: int64, minimum: 1}
                      column: {type: string}
                      value: {type: string, maxLength: 4096}
      responses:
        '202':
          description: Correction queued. Repeating the same edits returns the existing execution.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '400': {description: Invalid edits or attempted change to a valid row}
        '404': {description: Original run not found}
        '409': {description: A completed run with retained records is required}
        '410': {description: Original rows have expired}
        '413': {description: Corrected JSONL exceeds 20 MiB}
        '422': {description: A structural row error requires editing the source file}
  /api/runs/{id}/records/{partition}.jsonl:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - in: path
        name: partition
        required: true
        schema: {type: string, enum: [valid, rejected, corrected]}
    get:
      operationId: downloadPartition
      summary: Download valid rows, rejected row envelopes or the full corrected dataset
      responses:
        '200':
          description: UTF-8 JSON Lines attachment
          content:
            application/x-ndjson:
              schema: {type: string}
        '404': {description: Run or partition not found, or retention was not requested}
        '409': {description: Run has not completed successfully}
        '410': {description: Retained rows have expired}
  /api/runs/{id}/issues.csv:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: downloadIssues
      summary: Download the completed run's validation issues
      responses:
        '200':
          description: CSV with row, column and code
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '404': {description: Run not found}
        '409': {description: Run has not completed successfully}
components:
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Issue:
      type: object
      required: [row, index, column, code]
      properties:
        row: {type: integer, format: int64, minimum: 1}
        index: {type: integer, minimum: 0}
        column: {type: string}
        code: {type: string}
        suggestion:
          type: [object, 'null']
          required: [action, candidates]
          properties:
            action: {type: string, enum: [REPLACE, REVIEW_UNIQUENESS, REVIEW_DUPLICATE, CONFIRM_DATE_FORMAT]}
            candidates:
              type: array
              items: {type: string}
            relatedRow: {type: [integer, 'null'], format: int64}
    DatasetFormat:
      type: string
      enum: [CSV, JSONL, XLSX]
      default: CSV
    Schema:
      type: object
      required: [columns]
      properties:
        delimiter:
          type: string
          enum: [",", ";", "\t"]
          default: ","
        columns:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/Column'}
    Column:
      type: object
      required: [name, type]
      properties:
        name: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'}
        type: {type: string, enum: [STRING, INTEGER, DECIMAL, DATE, BOOLEAN]}
        required: {type: boolean, default: false}
        minLength: {type: [integer, 'null'], minimum: 0, maximum: 100000}
        maxLength: {type: [integer, 'null'], minimum: 0, maximum: 100000}
        allowedValues:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 1000}
        min:
          type: [number, 'null']
          description: Inclusive lower bound for INTEGER or DECIMAL. INTEGER bounds must be whole numbers.
        max:
          type: [number, 'null']
          description: Inclusive upper bound for INTEGER or DECIMAL. INTEGER bounds must be whole numbers.
        format:
          type: [string, 'null']
          enum: [EMAIL, null]
          description: Email syntax validation for STRING columns.
        unique:
          type: boolean
          default: false
          description: Reject repeated non-empty values that pass the column rules within this run. Comparison is case sensitive after trimming.
        defaultValue:
          type: [string, 'null']
          maxLength: 1000
          description: A valid value to suggest for missing required fields.
        inputDecimalSeparator:
          type: [string, 'null']
          enum: [",", ".", null]
          description: Decimal input convention used to suggest conversion to a dot.
    Run:
      type: object
      required: [id, schemaName, schemaVersion, state, submittedAt, format]
      properties:
        id: {type: string, format: uuid}
        schemaName: {type: string}
        schemaVersion: {type: integer}
        state: {type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED]}
        submittedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        totalRows: {type: [integer, 'null'], format: int64}
        invalidRows: {type: [integer, 'null'], format: int64}
        error: {type: [string, 'null']}
        format: {$ref: '#/components/schemas/DatasetFormat'}
        sheet: {type: [string, 'null']}
        recordsExpiresAt: {type: [string, 'null'], format: date-time}
        attemptStartedAt: {type: [string, 'null'], format: date-time}
        parentRunId: {type: [string, 'null'], format: uuid}
